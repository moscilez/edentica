services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: edentica
      POSTGRES_USER: edentica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - edentica-postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edentica -d edentica"]
      interval: 5s
      timeout: 3s
      retries: 15
  edentica:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://edentica:${POSTGRES_PASSWORD}@postgres:5432/edentica
      PUBLIC_URL: http://localhost:3000
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - edentica-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  edentica-data:
  edentica-postgres:
