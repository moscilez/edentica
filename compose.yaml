name: edentica
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: edentica
      POSTGRES_USER: edentica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - edentica-postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edentica -d edentica"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  edentica:
    build: .
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      EDENTICA_MODE: hackathon
      LLM_PROVIDER: cloudru
      DATABASE_URL: postgresql://edentica:${POSTGRES_PASSWORD}@postgres:5432/edentica
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      CLOUDRU_MODEL: ${CLOUDRU_MODEL:-}
      CLOUDRU_INPUT_RUB_PER_MILLION: ${CLOUDRU_INPUT_RUB_PER_MILLION:-}
      CLOUDRU_OUTPUT_RUB_PER_MILLION: ${CLOUDRU_OUTPUT_RUB_PER_MILLION:-}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - edentica-data:/app/data
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
volumes:
  edentica-data:
  edentica-postgres:
